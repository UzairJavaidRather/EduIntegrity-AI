# EduIntegrity AI — Docker Configuration
# 
# Two services:
#   backend  — FastAPI on port 8000
#   frontend — Nginx serving the static HTML on port 3000
#
# Usage:
#   docker-compose up --build
#
# Prerequisites:
#   - Docker Desktop installed and running
#   - .env file present in project root (copy from .env.example)

version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: eduintegrity-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount data/uploads for file processing
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: eduintegrity-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
